<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — NovaMart</title>
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="container">
    <h1 style="font-family:var(--font-display)">Welcome back</h1>
    <form id="form" class="form panel mt-2">
      <label>Username<input name="username" required /></label>
      <label>Password<input name="password" type="password" required /></label>
      <button class="btn" type="submit">Login</button>
      <p class="muted">No account? <a href="/register.html" style="color:var(--moss)">Register</a></p>
      <p class="muted">Admin demo: admin / admin123</p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('nav').innerHTML = renderNav();
    wireLogout();
    const next = new URLSearchParams(location.search).get('next') || '/';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: fd.get('username'),
            password: fd.get('password')
          })
        });
        saveAuth(data);
        location.href = next;
      } catch (err) {
        showToast(err.message);
      }
    });
  </script>
</body>
</html>
