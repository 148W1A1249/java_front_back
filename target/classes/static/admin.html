<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — NovaMart</title>
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="container">
    <h1 style="font-family:var(--font-display)">Admin catalog</h1>
    <div class="panel mt-2">
      <h2 style="font-family:var(--font-display);margin-top:0">Add product</h2>
      <form id="form" class="form" style="max-width:100%">
        <div class="row">
          <label style="flex:1">Name<input name="name" required /></label>
          <label style="flex:1">Price<input name="price" type="number" step="0.01" min="0.01" required /></label>
          <label style="width:120px">Stock<input name="stock" type="number" min="0" required /></label>
        </div>
        <label>Description<textarea name="description" rows="2"></textarea></label>
        <label>Image URL<input name="imageUrl" placeholder="https://..." /></label>
        <button class="btn" type="submit">Create product</button>
      </form>
    </div>
    <div class="panel mt-2">
      <h2 style="font-family:var(--font-display);margin-top:0">Products</h2>
      <div id="list"></div>
    </div>
    <div class="panel mt-2">
      <h2 style="font-family:var(--font-display);margin-top:0">All orders</h2>
      <div id="orders"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('nav').innerHTML = renderNav('admin');
    wireLogout();

    const user = currentUser();
    if (!user) location.href = '/login.html?next=/admin.html';
    if (!user.isAdmin) {
      document.querySelector('main').innerHTML = '<p class="muted">Admin access required.</p>';
    } else {
      loadProducts();
      loadOrders();
    }

    document.getElementById('form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/products', {
          method: 'POST',
          body: JSON.stringify({
            name: fd.get('name'),
            description: fd.get('description'),
            price: Number(fd.get('price')),
            stock: Number(fd.get('stock')),
            imageUrl: fd.get('imageUrl') || null,
            active: true
          })
        });
        e.target.reset();
        showToast('Product created');
        loadProducts();
      } catch (err) {
        showToast(err.message);
      }
    });

    async function loadProducts() {
      const root = document.getElementById('list');
      try {
        const page = await api('/products?page=0&size=50&sortBy=id&direction=desc');
        root.innerHTML = `
          <table class="table">
            <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead>
            <tbody>
              ${page.content.map(p => `
                <tr>
                  <td>${p.id}</td>
                  <td>${p.name}</td>
                  <td>${formatMoney(p.price)}</td>
                  <td>${p.stock}</td>
                  <td><button class="btn btn-ghost" data-del="${p.id}">Deactivate</button></td>
                </tr>`).join('')}
            </tbody>
          </table>`;
        root.querySelectorAll('[data-del]').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              await api(`/products/${btn.getAttribute('data-del')}`, { method: 'DELETE' });
              showToast('Product deactivated');
              loadProducts();
            } catch (e) { showToast(e.message); }
          });
        });
      } catch (err) {
        root.innerHTML = `<p class="muted">${err.message}</p>`;
      }
    }

    async function loadOrders() {
      const root = document.getElementById('orders');
      try {
        const orders = await api('/orders');
        if (!orders.length) {
          root.innerHTML = '<p class="muted">No orders yet.</p>';
          return;
        }
        root.innerHTML = orders.map(o => `
          <div class="mt-1" style="border-bottom:1px solid var(--fog);padding-bottom:0.75rem">
            <strong>#${o.id}</strong> · ${o.username} · ${formatMoney(o.totalAmount)} · ${o.status}
            <div class="muted">${new Date(o.createdOn).toLocaleString()}</div>
          </div>`).join('');
      } catch (err) {
        root.innerHTML = `<p class="muted">${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
